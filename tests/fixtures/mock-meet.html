<!doctype html>
<html><head><meta charset="utf-8"><title>Meet</title>
<style>
  /* Like Meet: the bottom bar holds the caption strip and the controls, and the video stage
     is positioned absolutely, its bottom offset set inline by script (room for the strip, the
     controls and a 16px margin). Inside, the tile block is placed by script too, at 16:9, and
     neither is recalculated when the space around them changes, only on a window resize. */
  body { margin: 0; height: 100vh; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 16px; right: 16px; }
  #grid { position: absolute; background: #333; overflow: hidden; }
  /* Like Meet with a camera on: the video is drawn wider than its tile, which crops it. */
  #grid video { position: absolute; top: 0; left: -40%; width: 180%; height: 100%; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; }
  #capbar { padding: 12px 0; }
  #capbar > div { height: 140px; overflow: hidden; } /* like Meet: a fixed-height panel */
  #controls { height: 80px; }
</style></head>
<body>
<!-- Meet's top bar shows participant avatars, earlier in the page than the stage. -->
<div id="topbar" style="position:absolute;top:0;right:0;z-index:1"><div data-participant-id="p1"><img alt=""></div></div>
<!-- Mimics Meet's caption DOM: one block per speaker turn, text revised in place. -->
<!-- Account button from the "Ready to join?" screen; the extension reads your name from it. -->
<a aria-label="Google Account: Sam Lee  (sam@example.com)" href="#" style="position:absolute;left:-999px">S</a>
<main id="stage" class="stg"><!-- Meet's stage also holds full-size layers that aren't tiles. --><div id="layer" style="position:absolute;inset:0;pointer-events:none"></div><div id="grid" aria-label="Alice Walker"><video></video>
<div data-participant-id="p1" aria-label="Alice Walker's tile"><button aria-label="Pin Alice Walker to your main screen">pin</button><div class="zWGUib">Alice</div></div>
<!-- Real tiles carry icon glyphs (pin, framing) marked notranslate, ahead of the name. -->
<div data-participant-id="p2"><button><i class="google-symbols notranslate" aria-hidden="true">keep_outline</i></button><div class="zWGUib">Bob</div></div>
<!-- ...and the name element can hold a second, hidden (sometimes truncated) copy of the name. -->
<div data-participant-id="p3"><span class="notranslate">frame_person</span><div class="notranslate"><span>Carol Diaz</span><span style="display:none">Carol D</span></div></div>
<div data-participant-id="p4"><div data-self-name="You" class="zWGUib notranslate">You</div></div>
</div></main>
<div id="bottom">
  <!-- The caption strip, above the controls; empty until captions are on. -->
  <div id="capbar" hidden><div></div></div>
  <footer id="controls"><button aria-label="Turn on captions (c)" aria-pressed="false" id="cc" jsname="RrG0hf">CC</button>
    <button aria-label="Turn off microphone">Mic</button><button aria-label="Leave call">Leave</button>
    <button id="pipBtn" onclick="openPip()">Pop out</button></footer>
</div>
<script>
// ?hl=es: Meet in Spanish, every label translated.
const es = new URLSearchParams(location.search).get("hl") === "es";
if (es) {
  document.getElementById("cc").setAttribute("aria-label", "Activar subtítulos (c)");
  document.querySelector('[aria-label="Turn off microphone"]').setAttribute("aria-label", "Desactivar micrófono");
  document.querySelector('[aria-label="Leave call"]').setAttribute("aria-label", "Salir de la llamada");
}
// Calendar meetings show their title in the tab; spontaneous calls show only the code.
const scheduled = location.pathname === "/abc-defg-hij";
document.title = scheduled ? "Meet - Weekly sync" : "Meet - " + location.pathname.slice(1);
let region = null, captionsOn = false;
const layoutStage = (measure) => {
  const stage = document.getElementById("stage"), grid = document.getElementById("grid");
  // From its own state, like Meet: room for the controls, plus the caption panel when captions are on.
  // On some of its own events (someone joining) Meet measures the bottom bar instead: if the
  // caption panel is collapsed then, it leaves it no room, until it next lays out.
  const room = measure ? document.getElementById("bottom").offsetHeight : 80 + (captionsOn ? 164 : 0);
  stage.style.bottom = room + 16 + "px";
  const W = stage.offsetWidth, H = stage.offsetHeight;
  const h = Math.min(H, W * 9 / 16), w = h * 16 / 9;
  Object.assign(grid.style, { left: (W - w) / 2 + "px", top: (H - h) / 2 + "px", width: w + "px", height: h + "px" });
};
layoutStage();
window.someoneJoined = () => layoutStage(true);
// Meet re-renders the stage, resetting its class list: classes added by others don't last.
setInterval(() => { document.getElementById("stage").className = "stg"; }, 300);
document.getElementById("cc").onclick = (e) => {
  e.target.setAttribute("aria-pressed", "true");
  e.target.setAttribute("aria-label", es ? "Desactivar subtítulos (c)" : "Turn off captions (c)");
  region = document.createElement("div");
  region.setAttribute("role", "region");
  region.setAttribute("aria-label", es ? "Subtítulos" : "Captions");
  document.getElementById("capbar").hidden = false;
  if (es) { // Meet's own id on the captions' container, whatever the language
    const wrap = document.createElement("div");
    wrap.setAttribute("jsname", "dsyhDe");
    wrap.append(region);
    document.querySelector("#capbar > div").append(wrap);
  } else document.querySelector("#capbar > div").append(region);
  captionsOn = true;
  layoutStage();
  run();
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function block(name) {
  const b = document.createElement("div");
  b.className = "nMcdL";
  b.innerHTML = '<div class="adE6rb"><img><div class="KcIKyf"><span class="NWpY1d"></span></div></div><div class="ygicle"></div>';
  b.querySelector(".NWpY1d").textContent = name;
  region.append(b);
  return b.querySelector(".ygicle");
}
async function run() {
  let t = block("Alice");
  for (const s of ["so", "so the", "so the launch", "So the launch is next", "So the launch is next Friday.",
                   "So the launch is next Friday. Can you send the deck by Thursday?"]) { t.textContent = s; await wait(120); }
  t = block("You");
  for (const s of ["yes", "Yes, I will send it.", "Yes, I will send it. We agreed to go with option B."]) { t.textContent = s; await wait(120); }
  // Long monologue whose front gets trimmed by Meet.
  t = block("Bob");
  let full = "";
  for (let i = 1; i <= 30; i++) {
    full += `Sentence number ${i} talks about the roadmap in detail. `;
    const shown = full.length > 500 ? full.slice(full.length - 500).replace(/^\S*\s/, "") : full;
    t.textContent = shown.trim();
    await wait(80);
  }
  await wait(300);
  region.firstElementChild.remove(); // old blocks scroll away
  t = block("Alice");
  t.textContent = "Great, thanks everyone.";
  window.done = true;
}
// Meet changes its page: caption lines keep coming, in a shape the extension can't read.
window.garble = () => setInterval(() => {
  const b = document.createElement("div");
  b.className = "nMcdL";
  b.textContent = "unreadable caption " + Date.now();
  region.append(b);
}, 300);
// Meet's picture-in-picture window: the video, the captions under it, the controls.
window.openPip = async () => {
  const w = await documentPictureInPicture.requestWindow({ width: 300, height: 420 });
  w.document.body.style.cssText = "margin:0;height:100vh;display:flex;flex-direction:column;background:#222";
  w.document.body.innerHTML = '<div id="pvid" style="flex:1;min-height:0"><div data-participant-id="p2" style="height:100%"><video style="width:100%;height:100%"></video></div></div>' +
    '<div id="pcapwrap" style="flex:none;padding:8px 0"><div role="region" aria-label="Captions" id="pcap" style="height:160px">' +
    '<div class="nMcdL"><div class="adE6rb"><div class="KcIKyf"><span class="NWpY1d">Alice</span></div></div><div class="ygicle">Seen in the mini window.</div></div></div></div>' +
    '<div id="pctrl" style="flex:none;height:60px"><button aria-label="Leave call">Leave</button></div>';
  return w;
};
// The chat panel: Meet's history from before the call, then this call's messages; one more
// arrives while it's open. Each message has Meet's message id; sender and time head a group.
const hhmm = (t) => new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const chatGroup = (sender, t, msgs) => '<div class="grp"><div class="hd"><span class="nm">' + sender + '</span> <span class="tm">' + hhmm(t) +
  '</span></div>' + msgs.map(([id, text]) => '<div class="msg" data-message-id="' + id + '"><div class="txt">' + text + '</div></div>').join("") + '</div>';
window.openChat = () => {
  const panel = document.createElement("aside");
  panel.id = "chatPanel";
  panel.style.cssText = "position:absolute;top:16px;right:16px;bottom:96px;width:344px;background:#fff;color:#000;overflow:auto";
  panel.innerHTML = '<div class="history">' +
    chatGroup("Claire Fitzsimons", Date.now() - 3 * 3600e3, [["old-1", "From an earlier day, not this call"]]) +
    chatGroup("Alice Walker", Date.now(), [["m-1", "Here's the deck: https://example.com/deck"], ["m-2", "Slides 4 & 5 are new"]]) +
    chatGroup("You", Date.now(), [["m-3", "Thanks, looking now"]]) +
    '</div><textarea aria-label="Send a message to everyone"></textarea>';
  document.body.append(panel);
  setTimeout(() => panel.querySelector(".history").insertAdjacentHTML("beforeend",
    chatGroup("Bob", Date.now(), [["m-4", "Can we <b>move</b> Friday's review?"]])), 1500);
};
// Leaving the call: Meet swaps the call UI for a "You left the meeting" screen.
window.leave = () => {
  document.body.innerHTML = "<h1>You left the meeting</h1><button>Rejoin</button>";
};
</script>
</body></html>
